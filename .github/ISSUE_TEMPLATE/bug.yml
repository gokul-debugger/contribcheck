name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ContribCheck. Please remove tokens and other sensitive data from reports and logs.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the issue reference, command, and minimum steps needed to reproduce the problem.
      placeholder: |
        1. Run `contribcheck inspect owner/repository#123`
        2. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ContribCheck version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and Python version.
      placeholder: macOS 15, Python 3.12
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste sanitized terminal output or logs. Do not include GitHub tokens.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed tokens and other sensitive information.
          required: true
